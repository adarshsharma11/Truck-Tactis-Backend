name: 🚀 Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # install deps clean
      - name: Install dependencies
        run: npm install

      # build project (this should include prisma generate + tsc)
      - name: Build project
        run: npm run build

      # 🚀 deploy to droplet
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/app/Truck-Tactis-Backend
            git pull origin main
            npm install
            npm run build
            pm2 restart truck-api || pm2 start dist/index.js --name truck-api
